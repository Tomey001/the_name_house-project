{% extends 'base.html' %}
{% block title %}Login — The Name Villa{% endblock %}

{% block login_content %}
<div class="login-page">
    <div class="login-card">

        <!-- Logo -->
        <div class="login-logo">
            <i class="bi bi-house-fill"></i>
        </div>

        <h1 class="login-title">THE NAME VILLA</h1>
        <p class="login-subtitle">Tenancy Management System</p>

        <!-- Login Form -->
        <form method="POST" action="{{ url_for('login') }}">

            <div class="form-group">
                <label class="form-label-tnh">Username</label>
                <div style="position:relative;">
                    <i class="bi bi-person"
                       style="position:absolute;left:12px;top:50%;
                              transform:translateY(-50%);
                              color:var(--text-muted);"></i>
                    <input
                        type="text"
                        class="form-control-tnh"
                        name="username"
                        placeholder="Enter your username"
                        style="padding-left:36px;"
                        required
                        autofocus
                    >
                </div>
            </div>

            <div class="form-group">
                <label class="form-label-tnh">Password</label>
                <div style="position:relative;">
                    <i class="bi bi-lock"
                       style="position:absolute;left:12px;top:50%;
                              transform:translateY(-50%);
                              color:var(--text-muted);"></i>
                    <input
                        type="password"
                        class="form-control-tnh"
                        name="password"
                        placeholder="Enter your password"
                        style="padding-left:36px;"
                        required
                    >
                </div>
            </div>

            <button type="submit"
                    class="btn-primary-tnh w-100 justify-content-center"
                    style="padding:12px;font-size:0.95rem;margin-top:8px;
                           width:100%;display:flex;">
                <i class="bi bi-box-arrow-in-right"></i>
                Sign In
            </button>

        </form>

        <p style="text-align:center;color:var(--text-muted);
                  font-size:0.75rem;margin-top:24px;">
© 2026 The Name Villa
        </p>

    </div>
</div>
{% endblock %}
